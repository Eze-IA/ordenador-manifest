name: Keep Streamlit App Awake

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit and Wake App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              # Usamos un User-Agent de un navegador real para no ser bloqueados como bot
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              )
              page = context.new_page()
              
              print('Navegando a la aplicación...')
              page.goto('https://ordenador-manifest-v2.streamlit.app/', wait_until='domcontentloaded')
              time.sleep(8) # Esperamos a que todo cargue
              
              button_found = False
              
              # Buscar en el documento principal y en todos los iframes posibles
              frames = [page] + page.frames
              for frame in frames:
                  try:
                      # Buscar cualquier botón que contenga texto similar a wake/back up
                      btn = frame.query_selector('button:has-text(\"Yes, get this app back up!\")') or \
                            frame.query_selector('button:has-text(\"wake\")')
                      if btn:
                          print('¡Botón encontrado! Haciendo clic para despertar...')
                          btn.click(force=True)
                          button_found = True
                          time.sleep(12)
                          break
                  except Exception as e:
                      continue

              if not button_found:
                  print('No se encontró el botón de suspensión. La app debería estar despierta.')

              browser.close()
          "
