name: Keep Streamlit App Awake

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit and Wake App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print('Navegando a la aplicación...')
              page.goto('https://ordenador-manifest-v2.streamlit.app/', wait_until='networkidle')
              time.sleep(5) # Esperar a que cargue el JavaScript
              
              # Intentar encontrar el botón de despertar por texto o selector
              wake_button = page.query_selector('button:has-text(\"Yes, get this app back up!\")') or \
                          page.query_selector('text=Yes, get this app back up!')

              if wake_button:
                  print('¡La app estaba dormida! Haciendo clic en el botón...')
                  wake_button.click()
                  print('Esperando 15 segundos para que despierte...')
                  time.sleep(15)
              else:
                  print('La app ya está despierta o no se encontró el botón.')

              browser.close()
          "
