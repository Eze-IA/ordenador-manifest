name: Keep Streamlit App Awake

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit and Wake App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto('https://ordenador-manifest-v2.streamlit.app/')
              page.wait_for_timeout(5000)
              
              # Si encuentra el botón de despertar, le hace clic
              button = page.query_selector('button:has-text(\"Yes, get this app back up!\")')
              if button:
                  print('La app estaba dormida, haciendo clic para despertarla...')
                  button.click()
                  page.wait_for_timeout(10000)
              else:
                  print('La app ya está despierta.')
              
              browser.close()
          "
